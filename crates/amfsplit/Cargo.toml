[package]
name = "amfsplit"
description = "Long-read AMF metabarcoding: regions, names and honest uncertainty"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
amfsplit-regions = { path = "../amfsplit-regions" }
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
flate2 = "1"

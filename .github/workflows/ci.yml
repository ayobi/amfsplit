name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Tests and frozen naming gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The 52 LSU-removal and genus rounds are read from amf-novelty-benchmark 0.3.2 (about 30 MB),
      # pinned by the holdout plan's hash and rounds/MANIFEST.json.
      - name: Fetch the archived LSU-removal rounds
        run: |
          git clone -q --depth 1 --branch 0.3.2 --filter=blob:none --no-checkout https://github.com/ayobi/amf-novelty-benchmark.git "$RUNNER_TEMP/anb"
          git -C "$RUNNER_TEMP/anb" sparse-checkout init --no-cone
          git -C "$RUNNER_TEMP/anb" sparse-checkout set /benchmarks/m4_external_holdout/rounds/ /benchmarks/m4_external_holdout/holdout_plan.json
          git -C "$RUNNER_TEMP/anb" checkout -q 0.3.2
          echo "AMFSPLIT_BENCHMARK=$RUNNER_TEMP/anb" >> "$GITHUB_ENV"
      # The validate parity case needs vsearch 2.27.0 and the V18 database, which are not stored
      # in the repository; without AMFSPLIT_TEST_VSEARCH and AMFSPLIT_TEST_V18 it reports SKIPPED.
      - name: Tests (Stage 1, triage and every naming gate)
        run: cargo test --release --locked
      - name: Gate 0 summary
        run: cargo run --release --locked -- gate0

  python-reference:
    name: Frozen Python rule regenerates the N6 goldens
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edlib==1.3.9.post1 biopython==1.88
      - run: python3 parity/naming/scripts/make_n6_golden.py
      - name: Goldens unchanged
        run: git diff --exit-code -- parity/naming/golden

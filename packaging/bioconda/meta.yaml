{% set name = "amfsplit" %}
{% set version = "0.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/ayobi/amfsplit/archive/refs/tags/v{{ version }}.tar.gz
  sha256: FILL_IN_AT_RELEASE

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ compiler('cxx') }}
    - cargo-bundle-licenses
  run:
    # the versions the paper's calls were made and verified with
    - blast ==2.17.0
    - mafft ==7.526
    - epa-ng ==0.3.8
    - itsxrust ==0.3.0

test:
  commands:
    - amfsplit --version
    - amfsplit name --help
    - test -d "${PREFIX}/share/amfsplit/naming/inputs/benchmark"
    - test -f "${PREFIX}/share/amfsplit/panels/amf_legacy_windows.tsv"

about:
  home: https://github.com/ayobi/amfsplit
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Name long-read AMF rDNA sequences across MaarjAM VT, UNITE SH and LSU species clades, with measured novelty
  dev_url: https://github.com/ayobi/amfsplit

extra:
  recipe-maintainers:
    - ayobi
